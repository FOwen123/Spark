# Checks every pull request; builds the Mac app (Apple Silicon) only when asked or released.
# - Pull requests: `bun run verify`.
# - Manual runs (Actions > Build > Run workflow): verify, then the .dmg attached to the run.
# - Pushing a tag like v0.2.0 (matching the version in Cargo.toml) also puts the .dmg in a draft
#   release. Manual runs and tags sign and notarize the app when the APPLE_* secrets are set.
name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

# A new push to a pull request cancels its run still going; releases finish.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium webkit
      - run: bun run verify
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/

  app:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the version (releases)
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || { echo "Set version = \"${GITHUB_REF_NAME#v}\" in Cargo.toml first"; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile

      # Tauri tries to sign with an empty APPLE_CERTIFICATE too, so the certificate goes into a
      # keychain here and only the other settings are passed on, when the secrets exist.
      - name: Use the Apple signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || exit 0
          KEYCHAIN="$RUNNER_TEMP/spark-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p spark "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p spark "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k spark "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      # Releases also build the signed update bundle the in-app updater installs; other builds
      # skip it, so they need no update key.
      - name: Turn on the update bundle (releases)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          jq '.bundle.createUpdaterArtifacts = true' apps/desktop/src-tauri/tauri.conf.json > conf.json
          mv conf.json apps/desktop/src-tauri/tauri.conf.json

      - run: bun run --cwd apps/desktop build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: spark-macos
          path: target/release/bundle/dmg/*.dmg

      - name: Draft the release (releases)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # latest.json is what installed copies read, through the newest published release.
          cd target/release/bundle
          jq -n --arg version "${GITHUB_REF_NAME#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat macos/Spark.app.tar.gz.sig)" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Spark.app.tar.gz" \
            '{version: $version, pub_date: $date, platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' > latest.json
          gh release create "$GITHUB_REF_NAME" --draft --title "Spark $GITHUB_REF_NAME" --generate-notes \
            dmg/*.dmg macos/Spark.app.tar.gz latest.json
